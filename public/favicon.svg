<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sunset Sky Gradient from Logo -->
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAE19"/>
      <stop offset="55%" stop-color="#F38218"/>
      <stop offset="100%" stop-color="#E86A17"/>
    </linearGradient>
    
    <!-- Savannah Earth Gradient from Logo -->
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16793B"/>
      <stop offset="100%" stop-color="#094423"/>
    </linearGradient>

    <!-- Clip Path for the circular badge -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="254" fill="#094423" />
  <circle cx="256" cy="256" r="248" fill="#FDFBF7" />

  <!-- Clipped Inner Badge -->
  <g clip-path="url(#circleClip)">
    
    <!-- Top Sunset Sky -->
    <rect x="0" y="0" width="512" height="340" fill="url(#sunsetGrad)"/>
    
    <!-- Horizontal Cloud Wisps -->
    <path d="M 40 140 Q 180 135 340 142 T 480 140 L 480 152 Q 320 156 160 148 T 40 152 Z" fill="#FFAE19" opacity="0.6"/>
    <path d="M 60 190 Q 220 185 360 192 T 470 190 L 470 200 Q 340 204 180 196 T 60 200 Z" fill="#FFAE19" opacity="0.5"/>

    <!-- Acacia Tree Silhouette (Center) -->
    <!-- Trunk -->
    <path d="M 252 330 C 252 280 248 240 242 205 C 240 190 236 175 230 160 C 235 162 245 168 250 178 C 256 190 262 215 264 245 C 265 275 266 310 266 330 Z" fill="#111827"/>
    <!-- Branches -->
    <path d="M 234 165 C 210 145 180 135 150 130 C 170 138 195 150 215 168 Z" fill="#111827"/>
    <path d="M 245 170 C 270 148 300 138 335 130 C 315 140 290 152 268 172 Z" fill="#111827"/>
    <path d="M 238 185 C 215 175 195 170 175 168 C 190 176 210 185 225 192 Z" fill="#111827"/>
    <path d="M 260 190 C 285 180 310 175 330 172 C 312 182 290 190 272 196 Z" fill="#111827"/>
    
    <!-- Umbrella Canopy Foliage -->
    <ellipse cx="245" cy="130" rx="95" ry="24" fill="#111827"/>
    <ellipse cx="180" cy="138" rx="65" ry="18" fill="#111827"/>
    <ellipse cx="310" cy="138" rx="65" ry="18" fill="#111827"/>
    <ellipse cx="245" cy="120" rx="70" ry="18" fill="#111827"/>
    <ellipse cx="205" cy="155" rx="45" ry="14" fill="#111827"/>
    <ellipse cx="285" cy="155" rx="45" ry="14" fill="#111827"/>

    <!-- Giraffe Silhouette (Left) -->
    <!-- Body & Legs -->
    <path d="M 195 240 C 190 215 175 180 162 135 C 160 128 158 115 155 105 C 158 102 165 102 168 108 C 172 118 178 140 184 175 C 195 210 205 235 225 245 C 235 250 240 260 238 275 C 235 290 220 295 205 295 C 190 295 180 285 180 270 C 178 255 185 245 195 240 Z" fill="#111827"/>
    <!-- Head & Horns -->
    <path d="M 155 105 C 153 100 150 95 145 92 C 142 90 138 90 135 93 C 132 96 135 102 140 106 C 145 110 152 112 155 105 Z" fill="#111827"/>
    <path d="M 152 95 L 150 88 M 155 96 L 155 88" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <!-- Giraffe Legs -->
    <path d="M 188 285 L 182 360 L 186 360 L 194 285 Z" fill="#111827"/>
    <path d="M 198 285 L 194 360 L 198 360 L 204 285 Z" fill="#111827"/>
    <path d="M 224 280 L 222 360 L 226 360 L 232 280 Z" fill="#111827"/>
    <path d="M 230 280 L 232 360 L 236 360 L 238 280 Z" fill="#111827"/>
    <!-- Tail -->
    <path d="M 235 270 Q 242 295 240 315" stroke="#111827" stroke-width="2.5" fill="none"/>

    <!-- Lion Silhouette (Right) -->
    <!-- Mane & Head -->
    <circle cx="320" cy="272" r="28" fill="#111827"/>
    <circle cx="308" cy="270" r="18" fill="#111827"/>
    <path d="M 296 265 C 290 268 285 272 282 278 C 285 282 292 285 298 282 Z" fill="#111827"/>
    <!-- Body & Back -->
    <path d="M 320 265 C 345 260 375 262 395 275 C 405 282 408 298 402 310 C 395 320 375 322 355 320 C 335 318 320 310 315 295 Z" fill="#111827"/>
    <!-- Forelegs -->
    <path d="M 322 290 L 320 355 L 328 355 L 332 290 Z" fill="#111827"/>
    <path d="M 335 290 L 338 355 L 345 355 L 344 290 Z" fill="#111827"/>
    <!-- Hindlegs -->
    <path d="M 385 295 C 392 310 395 330 392 355 L 385 355 C 382 335 380 315 375 300 Z" fill="#111827"/>
    <path d="M 398 295 C 405 310 408 330 404 355 L 398 355 C 395 335 392 315 388 300 Z" fill="#111827"/>
    <!-- Tail -->
    <path d="M 402 280 Q 425 290 422 315 Q 420 325 428 322" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="428" cy="322" r="4" fill="#111827"/>

    <!-- Bottom Savannah Green Mound -->
    <path d="M -20 330 Q 256 300 532 330 L 532 532 L -20 532 Z" fill="url(#earthGrad)"/>

    <!-- Brand Typography "Bliss Path" Script -->
    <text x="256" y="415" font-family="'Caveat', cursive, sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Bliss Path</text>
    <!-- "Tours & Safaris" Subtitle -->
    <text x="256" y="460" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TOURS &amp; SAFARIS</text>
    
  </g>
</svg>
